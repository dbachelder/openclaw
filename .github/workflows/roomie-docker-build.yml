name: Roomie Docker Build

on:
  push:
    branches:
      - deploy/2026.6.11
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        shell: bash
        run: echo "short=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha,scope=roomie-docker-amd64
          cache-to: type=gha,mode=max,scope=roomie-docker-amd64
          push: true
          tags: ghcr.io/dbachelder/openclaw:v2026.6.11-roomie-${{ steps.vars.outputs.short }}
